<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mon Premier Site</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Le titre dynamique est ici 👇 -->
    <h1>Bienvenue sur mon site, {{ nom }} !</h1>
    <p>Ce texte provient désormais d'un vrai fichier HTML indépendant.</p>
    
    <!-- Le formulaire d'envoi a été inséré ici 👇 -->
    <form action="/" method="GET">
        <label for="nom">Entrez votre prénom :</label>
        <input type="text" id="nom" name="nom" required>
        <button type="submit">Valider</button>
    </form>
    
    <hr>
    <nav>
        <a href="/">Accueil</a> | 
        <a href="/contact">Page de Contact</a>
    </nav>
</body>
</html>
